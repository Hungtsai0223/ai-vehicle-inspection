name: Next.js security and regression checks

on:
  push:
    branches:
      - security/harden-nextjs-oct-2026
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  update-lockfile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/security/harden-nextjs-oct-2026'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate reproducible npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile only when changed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: regenerate lockfile for Next.js security patch"
            git push origin HEAD:security/harden-nextjs-oct-2026
          fi

  verify:
    if: always() && (needs.update-lockfile.result == 'success' || needs.update-lockfile.result == 'skipped')
    needs: update-lockfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install from committed lockfile
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run regression tests
        run: npm test
      - name: Production build smoke test
        run: npm run build
